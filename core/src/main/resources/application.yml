spring:
  application:
    name: "spring-service-sample-core"

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/service_db
    username: postgres
    password: password

  jpa:
    database: postgresql
    hibernate:
      ddl-auto: update
    properties:
      jakarta:
        persistence:
          create-database-schemas: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/spring-services-samples

server:
  port: 8081
